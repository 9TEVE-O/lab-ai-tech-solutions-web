name: Validate web app

on:
  pull_request:
  push:
    branches:
      - main
      - fix/generator-policy-output-alignment

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Preview smoke test
        run: |
          set +e
          timeout 10s npm run preview -- --host 127.0.0.1
          code=$?
          if [ "$code" = "124" ]; then
            echo "Preview server started and stayed alive for smoke-test window."
            exit 0
          fi
          exit "$code"

      - name: Install Chromium for visual verification
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture visual verification screenshots
        run: |
          mkdir -p visual-verification
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/lab-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              cat /tmp/lab-preview.log
              exit 1
            fi
            sleep 1
          done

          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:4173/ visual-verification/home-desktop-1440.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:4173/ visual-verification/home-mobile-390.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:4173/safe-intake-proof-001 visual-verification/safe-intake-desktop-1440.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:4173/safe-intake-proof-001 visual-verification/safe-intake-mobile-390.png

      - name: Upload visual verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: visual-verification
          path: visual-verification/*.png
          if-no-files-found: error
          retention-days: 14
